id: RSK-002
title: Compromise of an administrator account exposes customer data
description: >-
  An attacker phishes or relays the credentials of an IT administrator and
  uses SSO and admin access to export consignee data from the portal back-end.
category: unauthorized_access
owner: Head of IT Infrastructure
assets: [AST-IDP, AST-PORTAL, AST-CUSTDATA, AST-EMAIL]
threat:
  source_type: adversarial
  source: Credential-phishing actors
  event: Theft and misuse of administrator credentials
vulnerabilities:
  - Legacy administrator accounts excluded from conditional access
  - Phishable MFA factors (push notifications)
properties: [confidentiality]

threat_event_frequency:
  dist: lognormal
  low: 4
  high: 30
  source: Email-security telemetry 2025-2026
  rationale: Targeted credential-phishing campaigns per year that reach administrators.
susceptibility:
  dist: beta_from_trials
  successes: 23
  trials: 480
  source: Phishing simulation Q2 2026 (EV-004)
  rationale: Share of recipients who submitted credentials, measured with the awareness programme in place.
primary_losses:
  - name: investigation
    form: response
    magnitude: {dist: lognormal, low: 30000, high: 400000}
  - name: service_disruption
    form: productivity
    magnitude: {dist: pert, min: 5000, mode: 30000, max: 150000}
secondary_loss:
  probability:
    dist: pert
    min: 0.3
    mode: 0.5
    max: 0.8
    rationale: Likelihood that admin misuse leads to a notifiable exfiltration of personal data.
  components:
    - name: gdpr_sanction_and_claims
      form: fines_judgments
      magnitude: {dist: lognormal, low: 50000, high: 1500000}
    - name: notification_and_reputation
      form: reputation
      magnitude: {dist: lognormal, low: 50000, high: 1000000}

controls:
  - control_id: CTL-IAM-01
    target: susceptibility
    reduction: {dist: pert, min: 0.7, mode: 0.9, max: 0.98}
    coverage: 0.9
    rationale: MFA defeats replay of stolen passwords; push fatigue remains possible; legacy admin accounts (10%) are excluded.
  - control_id: CTL-IAM-02
    target: primary_loss
    reduction: {dist: pert, min: 0.05, mode: 0.15, max: 0.3}
    rationale: Fewer standing privileges limit what a compromised administrator can reach.

treatments:
  - id: T1
    title: Phishing-resistant MFA (FIDO2) for all administrators
    type: modify
    description: Replace push MFA with hardware security keys for admins and bring legacy admin accounts under conditional access.
    change_controls:
      - control_id: CTL-IAM-01
        coverage: 1.0
        operating_rate: {dist: pert, min: 0.95, mode: 0.99, max: 0.999}
        rationale: FIDO2 is not susceptible to push fatigue or relay phishing.
    one_time_cost: 40000
    annual_cost: 15000
selected_treatment: T1

assumptions:
  - Susceptibility is measured with the awareness programme in place, so CTL-AWR-01 is not credited separately (this avoids double counting).
references: ["nist_csf_2_0:PR.AA-03", "nis2_2022_2555:21.2.j"]
