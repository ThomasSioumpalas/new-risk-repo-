# Internal control library ("common controls"): each control is tested once and
# mapped to many frameworks. Mapping relationships follow NIST IR 8477 and are
# read as "the CONTROL is <relationship> the REQUIREMENT".
# Test results are synthetic and chosen to show every conclusion type.

- id: CTL-IAM-01
  name: MFA for remote, cloud and privileged access
  description: Conditional-access policy enforces MFA for all interactive sign-ins to SSO, VPN and admin portals.
  type: preventive
  owner: Head of IT Infrastructure
  status: implemented
  frequency: continuous
  evidence: [EV-001]
  tests:
    - {id: T-IAM01-2026, kind: operating, performed_on: 2026-07-15, performed_by: Internal Audit, procedure: "Re-performance on 40 randomly sampled sign-ins", samples: 40, exceptions: 0, evidence: [EV-001]}
  mappings:
    - {framework: iso27001_2022, requirement: A.8.5, relationship: subset_of}
    - {framework: nist_csf_2_0, requirement: PR.AA-03, relationship: subset_of}
    - {framework: nis2_2022_2555, requirement: 21.2.j, relationship: subset_of, rationale: "Covers MFA; not secured voice/video or emergency communications."}

- id: CTL-IAM-02
  name: Quarterly privileged access review
  description: Owners of privileged groups recertify membership each quarter; leavers and role changes are removed.
  type: detective
  owner: IT Security Manager
  status: implemented
  frequency: quarterly
  evidence: [EV-002]
  tests:
    - {id: T-IAM02-2026, kind: operating, performed_on: 2026-07-05, performed_by: Internal Audit, procedure: "Inspection of 25 sampled privileged accounts against review records", samples: 25, exceptions: 1, evidence: [EV-002]}
  mappings:
    - {framework: iso27001_2022, requirement: A.5.18, relationship: subset_of}
    - {framework: iso27001_2022, requirement: A.8.2, relationship: intersects_with}
    - {framework: nist_csf_2_0, requirement: PR.AA-05, relationship: subset_of}
    - {framework: nis2_2022_2555, requirement: 21.2.i, relationship: intersects_with}

- id: CTL-EML-01
  name: Email filtering and attachment sandboxing
  description: Inbound email is scanned, attachments detonated in a sandbox and URLs rewritten and checked at click time.
  type: preventive
  owner: Messaging Engineer
