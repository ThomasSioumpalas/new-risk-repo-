  frequency: continuous
  evidence: [EV-012]
  tests:
    - {id: T-EML01-2026, kind: operating, performed_on: 2026-07-01, performed_by: IT Security Analyst, procedure: "30 sampled malicious test messages", samples: 30, exceptions: 0, evidence: [EV-012]}
  mappings:
    - {framework: iso27001_2022, requirement: A.8.7, relationship: intersects_with}
    - {framework: nist_csf_2_0, requirement: DE.CM-09, relationship: intersects_with}

