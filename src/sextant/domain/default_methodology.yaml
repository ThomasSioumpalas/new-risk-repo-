# Reference risk methodology (risk criteria) for Sextant.
#
# These are illustrative criteria for a fictional mid-sized EU organisation
# (annual revenue about EUR 250M). They are a *starting point* that the
# methodology owner must adapt to the organisation's context. They are not
# universal truths. See docs/RISK_METHODOLOGY.md for the reasoning behind each
# choice.
id: sextant-reference
version: "1.0.0"
name: Sextant reference methodology
owner: Chief Information Security Officer
currency: EUR

# Likelihood is banded on the expected number of LOSS EVENTS per year
# (FAIR loss event frequency), not on an undefined "probability" word.
# P(at least one event in a year) = 1 - exp(-rate) is shown in reports.
likelihood_scale:
  - {level: 1, name: Very Low,  lower: 0.0,  upper: 0.05, description: "Less than once in 20 years (P(>=1/yr) < 5%)"}
  - {level: 2, name: Low,       lower: 0.05, upper: 0.2,  description: "Once in 5-20 years"}
  - {level: 3, name: Moderate,  lower: 0.2,  upper: 1.0,  description: "Once in 1-5 years"}
  - {level: 4, name: High,      lower: 1.0,  upper: 5.0,  description: "1-5 times per year"}
  - {level: 5, name: Very High, lower: 5.0,               description: "More than 5 times per year"}

# Impact is banded on the EXPECTED LOSS PER EVENT (all loss forms, including
# probability-weighted secondary loss). The non-financial descriptors support
# qualitative rating; the worst dimension determines the overall impact.
impact_scale:
  - level: 1
    name: Very Low
    lower: 0
    upper: 50000
    description: "< EUR 50k"
    descriptors:
      operational: "No noticeable disruption"
      legal_regulatory: "No regulatory interest"
      reputational: "No external visibility"
  - level: 2
    name: Low
    lower: 50000
    upper: 250000
    description: "EUR 50k - 250k"
    descriptors:
      operational: "Degraded internal service < 1 business day"
      legal_regulatory: "Minor contractual issue; no notification duty"
      reputational: "Limited complaints; no media"
  - level: 3
    name: Moderate
    lower: 250000
    upper: 1000000
    description: "EUR 250k - 1M"
    descriptors:
      operational: "Customer-facing disruption 1-3 days"
      legal_regulatory: "Notifiable incident (e.g. GDPR Art. 33 / NIS2 Art. 23); no sanction expected"
      reputational: "Local / trade media coverage"
  - level: 4
    name: High
    lower: 1000000
    upper: 5000000
    description: "EUR 1M - 5M"
    descriptors:
      operational: "Critical service outage 3-10 days"
      legal_regulatory: "Regulatory investigation; sanction plausible"
      reputational: "National media; measurable customer churn"
  - level: 5
    name: Very High
    lower: 5000000
    description: "> EUR 5M"
    descriptors:
      operational: "Critical service outage > 10 days or permanent data loss"
      legal_regulatory: "Significant sanction; licence or contract at risk"
      reputational: "Sustained national/international coverage; loss of key customers"

risk_levels: [Very Low, Low, Moderate, High, Very High]

# Rows: likelihood 1..5; columns: impact 1..5.
# Structure follows NIST SP 800-30 Rev.1, Appendix I, Table I-2.
# This is a LOOKUP, not a multiplication of ordinal numbers.
matrix:
  - [Very Low, Very Low, Very Low, Low,      Low]        # likelihood 1 (Very Low)
  - [Very Low, Low,      Low,      Low,      Moderate]   # likelihood 2 (Low)
  - [Very Low, Low,      Moderate, Moderate, High]       # likelihood 3 (Moderate)
  - [Very Low, Low,      Moderate, High,     Very High]  # likelihood 4 (High)
  - [Very Low, Low,      Moderate, High,     Very High]  # likelihood 5 (Very High)

# Who may accept which residual risk, for how long, and how often it is reviewed.
acceptance:
  - {risk_level: Very Low,  min_authority: risk_owner,   max_acceptance_days: 730, review_every_days: 365}
  - {risk_level: Low,       min_authority: risk_owner,   max_acceptance_days: 365, review_every_days: 365}
  - {risk_level: Moderate,  min_authority: risk_manager, max_acceptance_days: 365, review_every_days: 180}
  - {risk_level: High,      min_authority: executive,    max_acceptance_days: 180, review_every_days: 90}
  - {risk_level: Very High, min_authority: executive,    max_acceptance_days: 90,  review_every_days: 30}

appetite:
  scenario_ale_threshold: 500000
  max_acceptable_level: Moderate
  # Portfolio tolerance: the board is willing to tolerate at most these
  # annual exceedance probabilities.
  tolerance_curve:
    - {loss: 1000000,  max_probability: 0.25}
    - {loss: 5000000,  max_probability: 0.05}
    - {loss: 20000000, max_probability: 0.01}

simulation:
  trials: 20000
  max_trials: 200000
  seed: 20260101
  loss_component_correlation: 0.5
  max_simulated_events: 8000000
  cost_amortisation_years: 3

control_testing:
  tolerable_deviation_rate: 0.10
  required_confidence: 0.90
  lookback_days: 365
  prior_alpha: 1.0
  prior_beta: 1.0

notes:
  - "Likelihood bands use loss-event frequency; impact bands use expected loss per event."
  - "Quantitative evaluation (ALE and tolerance curve) takes precedence for material risks."
  - "The matrix is retained for communication and for comparability with qualitative assessments."
