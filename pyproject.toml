[project]
name = "sextant"
version = "0.1.0"
description = "Quantitative, auditable information-security risk register (FAIR-aligned Monte Carlo, ISO 27005 / NIST aware)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Thomas Sioumpalas" }]
keywords = ["risk management", "GRC", "ISO 27005", "FAIR", "Monte Carlo", "compliance", "NIST CSF"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "structlog>=24.4",
    "typer>=0.12",
    "jinja2>=3.1",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
sextant = "sextant.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sextant"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit security rules
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "N",             # naming
    "C4",            # comprehensions
    "PT",            # pytest style
    "DTZ",           # timezone-aware datetimes (audit timestamps)
]
ignore = [
    "N803", "N806",  # maths notation (lambda_, N, K) is clearer in the engine
    "RUF001", "RUF002", "RUF003",  # allow ×, λ, σ in docstrings/comments
]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 110; long user-facing message strings may run to 120.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PT011"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: statistical validation tests with large simulations",
]
filterwarnings = [
    "error::DeprecationWarning:sextant.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["sextant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
